name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/lint-design.py
      - run: bash scripts/swift.sh test
      - run: bash scripts/build-app.sh --universal
