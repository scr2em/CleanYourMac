 Neue, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Node dependencies and generated build data often make good first reviews. Every action shows its</text><text x="279" y="751" fill="#65756D" font-family="SF Pro, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">paths and consequences before it runs.</text><g transform="translate(1087 690) scale(0.068359375)"><rect width="1024" height="1024" rx="224" fill="#137969"/><path d="M265 740C202 642 209 491 307 382C405 272 589 226 776 246C784 422 741 603 632 713C526 819 371 830 265 740Z" fill="#5EBEA5"/><path d="M520 370L544 444L618 470L544 495L520 570L495 495L420 470L495 445Z" fill="#FFFDF5" stroke="#FFFDF5" stroke-width="14" stroke-linejoin="round"/></g></g><text x="1172" y="845" fill="#65756D" font-family="SF Pro, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="end">DESIGN CONCEPT · FIXTURE DATA</text><text x="20" y="845" fill="#65756D" font-family="SF Pro, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start">COMFY 1.0  /  OVERVIEW</text></svg>